mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
dns:
    enable: true
    ipv6: false
    default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    respect-rules: true
    proxy-server-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
    nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
    fallback: [1.1.1.1, 8.8.8.8]
    fallback-filter:
        {
            geoip: true,
            geoip-code: CN,
            geosite: [gfw],
            ipcidr: [240.0.0.0/4],
            domain: [+.google.com, +.facebook.com, +.youtube.com],
        }
proxies:
proxy-groups:
    - { name: Paily Connect, type: select, proxies: [自动选择, 故障转移] }
    - {
          name: 自动选择,
          type: url-test,
          proxies: [],
          url: "http://www.gstatic.com/generate_204",
          interval: 86400,
      }
    - {
          name: 故障转移,
          type: fallback,
          proxies: [],
          url: "http://www.gstatic.com/generate_204",
          interval: 7200,
      }
